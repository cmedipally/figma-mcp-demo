<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        img { border: 2px solid #ccc; margin: 10px; max-width: 300px; }
        .status { font-weight: bold; color: green; }
        .error { font-weight: bold; color: red; }
    </style>
</head>
<body>
    <h1>Image Loading Test</h1>

    <h2>Hero Large Image:</h2>
    <img src="images/hero-large.jpg" alt="Hero" onload="this.nextElementSibling.innerHTML='✅ Loaded'" onerror="this.nextElementSibling.innerHTML='❌ Failed to load'">
    <div class="status">Loading...</div>

    <h2>Tile Image:</h2>
    <img src="images/tile-image.jpg" alt="Tile" onload="this.nextElementSibling.innerHTML='✅ Loaded'" onerror="this.nextElementSibling.innerHTML='❌ Failed to load'">
    <div class="status">Loading...</div>

    <h2>News Thumbnail:</h2>
    <img src="images/news-thumb.jpg" alt="News" onload="this.nextElementSibling.innerHTML='✅ Loaded'" onerror="this.nextElementSibling.innerHTML='❌ Failed to load'">
    <div class="status">Loading...</div>

    <h2>Arrow Icon:</h2>
    <img src="images/arrow-icon.png" alt="Arrow" onload="this.nextElementSibling.innerHTML='✅ Loaded'" onerror="this.nextElementSibling.innerHTML='❌ Failed to load'">
    <div class="status">Loading...</div>
</body>
</html>
